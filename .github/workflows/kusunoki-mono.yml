name: Generate Kusunoki Mono Font to Current Repo...

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          show-progress: true
          fetch-depth: 1

      - name: Check Homebrew
        run: |
          brew --version
          brew config

      - name: Build Kusunoki Mono
        run: |
          brew trust peinan/tap
          brew tap peinan/tap
          brew install --cask font-kusunoki-mono

      - name: Copy Fonts I Need
        run: |
          brew list --cask --verbose font-kusunoki-mono
          mkdir -p ./KusunokiMono
          cp "$(brew --prefix kusunoki-mono)/share/fonts/"*.otf ./KusunokiMono/
          ls -lah ./KusunokiMono

      - name: Deploy to GitHub Repository
        run: |
          git config --global user.email ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com
          git config --global user.name ${{ github.actor }}
          git config diff.nocase.textconv "tr '[:upper:]' '[:lower:]'"
          git status
          git add --all

          if git diff --cached --quiet; then
            echo "No Changes To Commit."
            exit 0
          fi

          git commit -m 'Update::Kusunoki Mono'
          git pull --rebase --autostash
          git push
