name: Generate Kusunoki Mono Font to Current Repo...

on:
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: macos-latest

    steps:
      - name: Check Homebrew
        run: |
          brew --version
          brew config

      - name: Build Kusunoki Mono
        run: |
          brew trust peinan/tap
          brew tap peinan/tap
          brew install --cask font-kusunoki-mono

      - name: Copy Fonts I Need
        run: |
          brew list --cask --verbose font-kusunoki-mono
          find "$(brew --prefix)" -type f -name '*.otf' 2>/dev/null | grep -i kusunoki || true
          cp "$HOME/Library/Fonts/"*Kusunoki*.otf ./KusunokiMono/
          ls -lah ./KusunokiMono

      - name: Deploy to GitHub Repository
        run: |
          git config --global user.email ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com
          git config --global user.name ${{ github.actor }}
          git config diff.nocase.textconv "tr '[:upper:]' '[:lower:]'"
          git status
          git add --all

          if git diff --cached --quiet; then
            echo "No Changes To Commit."
            exit 0
          fi

          git commit -m 'Update::Kusunoki Mono'
          git pull --rebase --autostash
          git push
